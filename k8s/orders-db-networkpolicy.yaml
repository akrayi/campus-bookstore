apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db-ingress
  namespace: campus-bookstore
spec:
  podSelector:
    matchLabels:
      app: orders-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 5432
