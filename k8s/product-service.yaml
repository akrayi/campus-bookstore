apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-data
  namespace: campus-bookstore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: campus-bookstore
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 5001
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: campus-bookstore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: prepare-catalog
          image: campus-bookstore/product-service:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -ec
            - |
              install -d -o 10001 -g 10001 /data/catalog
              if [ ! -f /data/catalog/products.db ]; then
                install -o 10001 -g 10001 -m 0600 \
                  /app/products.db /data/catalog/products.db
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: product-service
          image: campus-bookstore/product-service:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          env:
            - name: PRODUCT_DB_PATH
              value: /data/catalog/products.db
          ports:
            - name: http
              containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-data