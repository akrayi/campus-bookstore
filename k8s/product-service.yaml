apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-data
  namespace: campus-bookstore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: campus-bookstore
  labels:
    bookstore-metrics: enabled
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 5001
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: campus-bookstore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-catalog
          image: campus-bookstore/product-service:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -ec
            - |
              umask 0077
              mkdir -p /data/catalog
              if [ ! -f /data/catalog/products.db ]; then
                cp /app/products.db /data/catalog/products.db
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: product-service
          image: campus-bookstore/product-service:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: PRODUCT_DB_PATH
              value: /data/catalog/products.db
          ports:
            - name: http
              containerPort: 5001
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-data
