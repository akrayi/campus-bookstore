apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: campus-bookstore
data:
  PRODUCT_SERVICE_URL: "http://product-service:5001"
  POSTGRES_HOST: "orders-db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "bookstore_orders"
  POSTGRES_USER: "bookstore"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: campus-bookstore
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 5002
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: campus-bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: campus-bookstore/order-service:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: order-service-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 5002
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi