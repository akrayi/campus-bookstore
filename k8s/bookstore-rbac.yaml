---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore-reader
  namespace: campus-bookstore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: campus-bookstore
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookstore-reader-pods
  namespace: campus-bookstore
subjects:
  - kind: ServiceAccount
    name: bookstore-reader
    namespace: campus-bookstore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader