name: Bookstore CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser and manifest test dependencies
        run: |
          npm ci --prefix tests
          npm exec --prefix tests -- playwright install --with-deps chromium

      - name: Check Kubernetes manifests
        run: npm run --prefix tests manifests

      - name: Install service dependencies
        run: |
          python -m pip install \
            -r product-service/requirements.txt \
            -r order-service/requirements.txt

      - name: Test the Product Service
        run: python -m unittest discover -s product-service -p "test_app.py" -v

      - name: Test the Order Service
        run: python -m unittest discover -s order-service -p "test_orders.py" -v

      - name: Generate a database password for this run
        run: |
          password=$(python -c "import secrets; print(secrets.token_hex(32))")
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build images and start the Compose stack
        run: docker compose -p campus-bookstore-tests -f compose.yaml -f compose.test.yaml up -d --build --wait --wait-timeout 180

      - name: Run integration and end-to-end tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run browser regression tests
        run: npm run --prefix tests browser

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p campus-bookstore-tests -f compose.yaml -f compose.test.yaml logs --no-color --tail=80
        env:
          POSTGRES_PASSWORD: unused-for-reading-logs

      - name: Stop the CI stack
        if: always()
        run: docker compose -p campus-bookstore-tests -f compose.yaml -f compose.test.yaml down --volumes
        env:
          POSTGRES_PASSWORD: unused-for-cleanup

  deploy-local:
    # Never execute fork pull requests on a laptop runner. Opt in after registration.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      vars.ENABLE_LOCAL_DEPLOY == 'true'
    needs: build-and-test
    runs-on: [self-hosted, Windows, X64, campus-bookstore]
    timeout-minutes: 20
    concurrency:
      group: bookstore-local-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy tested commit to Docker Desktop Kubernetes
        shell: cmd
        env:
          POSTGRES_PASSWORD: ${{ secrets.BOOKSTORE_POSTGRES_PASSWORD }}
        run: python scripts/deploy.py --tag ${{ github.sha }}
      - name: Verify networking, RBAC, availability and HPA
        shell: cmd
        run: python scripts/verify_cluster.py
