name: Bookstore CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install service dependencies
        run: |
          python -m pip install \
            -r product-service/requirements.txt \
            -r order-service/requirements.txt

      - name: Test the Product Service
        run: python -m unittest discover -s product-service -p "test_app.py" -v

      - name: Test the Order Service
        run: python -m unittest discover -s order-service -p "test_orders.py" -v

      - name: Generate a database password for this run
        run: |
          password=$(python -c "import secrets; print(secrets.token_hex(32))")
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build images and start the Compose stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Run integration and end-to-end tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80
        env:
          POSTGRES_PASSWORD: unused-for-reading-logs

      - name: Stop the CI stack
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: unused-for-cleanup