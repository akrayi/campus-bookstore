apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstore-loki-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-loki
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookstore-loki
  template:
    metadata:
      labels:
        app: bookstore-loki
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.6.0
          args:
            - -config.file=/etc/loki/local-config.yaml
            - -log.level=info
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /loki
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookstore-loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-loki
  namespace: monitoring
spec:
  selector:
    app: bookstore-loki
  ports:
    - name: http
      port: 3100
      targetPort: http