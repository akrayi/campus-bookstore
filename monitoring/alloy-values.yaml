controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      discovery.kubernetes "bookstore" {
        role = "pod"
        namespaces {
          names = ["campus-bookstore"]
        }
      }

      discovery.relabel "bookstore" {
        targets = discovery.kubernetes.bookstore.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "bookstore" {
        targets    = discovery.relabel.bookstore.output
        forward_to = [loki.write.bookstore.receiver]
      }

      loki.write "bookstore" {
        endpoint {
          url = "http://bookstore-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }