apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bookstore.json: |
    {
      "uid": "campus-bookstore",
      "title": "Campus Bookstore",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "API requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(bookstore_http_requests_total[2m]))"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "API p95 latency (seconds)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(bookstore_http_request_duration_seconds_bucket[2m])))"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Server errors per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(bookstore_http_requests_total{status=~\"5..\"}[2m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod CPU cores",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"campus-bookstore\",container!=\"\",container!=\"POD\"}[2m]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod memory bytes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"campus-bookstore\",container!=\"\",container!=\"POD\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Order desired replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"campus-bookstore\"}"
            }
          ]
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Bookstore pod logs",
          "datasource": {
            "type": "loki",
            "uid": "bookstore-loki"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"campus-bookstore\"}"
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
