resolver 127.0.0.11 valid=5s ipv6=off;
upstream product_api {
    zone product_api 64k;
    server product-service:5001 resolve;
}
upstream order_api {
    zone order_api 64k;
    server order-service:5002 resolve;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location /api/products {
        proxy_pass http://product_api/products;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /api/quotes/ {
        proxy_pass http://order_api/quotes/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /api/orders {
        proxy_pass http://order_api/orders;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ =404; }
}
