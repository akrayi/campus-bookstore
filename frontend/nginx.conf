resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
limit_req_zone $binary_remote_addr zone=bookstore_api:10m rate=20r/s;
upstream product_api {
    zone product_api 64k;
    server product-service${SERVICE_DOMAIN}:5001 resolve;
}
upstream order_api {
    zone order_api 64k;
    server order-service${SERVICE_DOMAIN}:5002 resolve;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location /api/products {
        limit_req zone=bookstore_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://product_api/products;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /api/quotes/ {
        limit_req zone=bookstore_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://order_api/quotes/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /api/orders {
        limit_req zone=bookstore_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://order_api/orders;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ =404; }
}
